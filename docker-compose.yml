services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulsepass
      POSTGRES_DB: pulse_dispatch
    ports:
      - "5433:5432"
    volumes:
      - pulse_pg:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  server:
    build: ./apps/server
    environment:
      PORT: 4100
      DATABASE_URL: postgres://pulse:pulsepass@postgres:5432/pulse_dispatch
      REDIS_URL: redis://redis:6379
    ports:
      - "4100:4100"
    depends_on:
      - postgres
      - redis
volumes:
  pulse_pg:
